<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Software – Sierra WordPress Theme</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="output.css" />
  </head>
  <body style="font-family: 'Inter', sans-serif" class="lg:relative">
    <div
      class="hidden md:hidden lg:fixed lg:right-0 lg:top-[35%] lg:z-30 lg:flex lg:flex-col lg:justify-center lg:items-center lg:bg-white lg:rounded-tl-xl lg:rounded-bl-xl lg:shadow"
    >
      <div class="group border-b border-solid border-[#acaaaa]">
        <i
          title="KeyDesign Framework"
          class="px-3 py-3 fa-solid fa-gear group-hover:text-[#1B1AFF] transition-colors duration-500 ease-in-out"
        ></i>
      </div>
      <div class="group border-b border-solid border-[#acaaaa]">
        <i
          title="Customer Support"
          class="px-3 py-3 fa-solid fa-life-ring group-hover:text-[#1B1AFF] transition-colors duration-500 ease-in-out"
        ></i>
      </div>
      <div class="group border-b border-solid border-[#acaaaa]">
        <i
          title="Read Documentation"
          class="px-3 py-3 fa-solid fa-file-invoice group-hover:text-[#1B1AFF] transition-colors duration-500 ease-in-out"
        ></i>
      </div>
      <div class="group border-b border-solid border-[#acaaaa]">
        <i
          title="User Community"
          class="px-3 py-3 fa-regular fa-circle-user group-hover:text-[#1B1AFF] transition-colors duration-500 ease-in-out"
        ></i>
      </div>
      <div class="group">
        <i
          title="Purchase Joule"
          class="px-3 py-3 fa-solid fa-cart-shopping group-hover:text-[#1B1AFF] transition-colors duration-500 ease-in-out"
        ></i>
      </div>
    </div>

    <!-- Header -->
    <header class="border border-[#edf2f7] border-solid" id="header">
      <div
        class="px-2.5 py-5 flex justify-between lg:max-w-[1250px] lg:mx-auto lg:py-[5px]"
      >
        <div class="flex justify-center items-center md:pl-2.5">
          <img
            class="w-[110px] h-[26.58px]"
            src="https://sierra.keydesign.xyz/ai-software/wp-content/uploads/sites/6/2023/09/sierra-ai-logo-1.svg"
            alt="logo"
          />
        </div>

        <div
          class="flex justify-end lg:justify-between lg:items-center lg:p-2.5 lg:gap-2.5 lg:font-medium lg:ml-56"
        >
          <ul
            class="hidden lg:flex lg:items-center lg:gap-9 lg:text-[#181B1F] lg:px-2.5"
          >
            <li
              class="transition-all duration-400 ease-in-out hover:text-[#1B1AFF] hover:decoration-1 cursor-pointer"
            >
              Features
            </li>
            <li
              class="transition-all duration-400 ease-in-out hover:text-[#1B1AFF] hover:decoration-1 cursor-pointer"
            >
              Pricing
            </li>
            <li
              class="transition-all duration-400 ease-in-out hover:text-[#1B1AFF] hover:decoration-1 cursor-pointer"
            >
              Help
            </li>
            <li
              class="transition-all duration-400 ease-in-out hover:text-[#1B1AFF] hover:decoration-1 cursor-pointer"
            >
              Contact
            </li>
          </ul>

          <div class="block px-2.5 text-xl">
            <i
              class="fa-solid fa-magnifying-glass lg:cursor-pointer lg:transition-all lg:duration-400 lg:ease-in-out lg:hover:text-[#1B1AFF]"
            ></i>
          </div>

          <div class="block px-2.5 text-xl lg:hidden">
            <i class="fa-solid fa-bars"></i>
          </div>

          <div
            class="hidden lg:block lg:border lg:border-transparent lg:px-5 lg:py-3 lg:bg-[#1B1AFF] lg:text-white lg:rounded-3xl"
          >
            <button>Start free trial</button>
          </div>
        </div>
      </div>
    </header>

    <a
      class="hidden md:hidden lg:flex lg:justify-center lg:items-center lg:fixed lg:right-5 lg:bottom-5 lg:w-[50px] lg:h-[50px] lg:border-2 lg:border-[#1B1AFF] lg:rounded-full lg:transition-colors lg:duration-400 lg:ease-in-out lg:hover:bg-[#1B1AFF] lg:hover:text-white"
      href="#header"
      ><i class="fa-solid fa-angle-up font-bold"></i
    ></a>
  </body>
</html>
