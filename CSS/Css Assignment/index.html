<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Freelancer - Theme Preview - Start Bootstrap</title>
    <link
      href="https://fonts.googleapis.com/css?family=Montserrat:400,700"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Lato:400,700,400italic,700italic"
      rel="stylesheet"
      type="text/css"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav class="navbar">
      <div class="container">
        <a href="#home" class="logo">START BOOTSTRAP</a>

        <ul class="nav-links">
          <li><a href="#portfolio">PORTFOLIO</a></li>
          <li><a href="#about">ABOUT</a></li>
          <li><a href="#contact">CONTACT</a></li>
        </ul>
        <button class="menu-bar">
          Menu
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>
    </nav>

    <!-- Hero section -->
    <section id="home" class="hero">
      <div class="container">
        <img
          src="https://startbootstrap.github.io/startbootstrap-freelancer/assets/img/avataaars.svg"
          alt="Avatar"
          class="hero-avatar"
        />
        <h1>START BOOTSTRAP</h1>
        <div class="divider light">
          <div class="divider-line"></div>
          <div class="divider-icon"><i class="fa-solid fa-star"></i></div>
          <div class="divider-line"></div>
        </div>
        <p class="hero-text">Graphic Artist - Web Designer - Illustrator</p>
      </div>
    </section>

    <!-- Portfolio Section -->
    <section id="portfolio" class="portfolio">
      <div class="container">
        <h2>PORTFOLIO</h2>
        <div class="divider dark">
          <div class="divider-line"></div>
          <div class="divider-icon"><i class="fa-solid fa-star"></i></div>
          <div class="divider-line"></div>
        </div>
        <div class="portfolio-grid">
          <div class="portfolio-item">
            <img
              src="https://startbootstrap.github.io/startbootstrap-freelancer/assets/img/portfolio/cabin.png"
              alt="Cabin"
            />
          </div>
          <div class="portfolio-item">
            <img
              src="https://startbootstrap.github.io/startbootstrap-freelancer/assets/img/portfolio/cake.png"
              alt="Cake"
            />
          </div>
          <div class="portfolio-item">
            <img
              src="https://startbootstrap.github.io/startbootstrap-freelancer/assets/img/portfolio/circus.png"
              alt="Circus"
            />
          </div>
          <div class="portfolio-item">
            <img
              src="https://startbootstrap.github.io/startbootstrap-freelancer/assets/img/portfolio/game.png"
              alt="Game"
            />
          </div>
          <div class="portfolio-item">
            <img
              src="https://startbootstrap.github.io/startbootstrap-freelancer/assets/img/portfolio/safe.png"
              alt="Safe"
            />
          </div>
          <div class="portfolio-item">
            <img
              src="https://startbootstrap.github.io/startbootstrap-freelancer/assets/img/portfolio/submarine.png"
              alt="Submarine"
            />
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
